# How a port of this package is written down, so that it lands on the geometry:
#
# * An opening's port is on the face the opening starts at, and its +Z points
#   into the material. A shaft's port is where it ends, and its +Z points away
#   from the shaft's body. Connecting two ports turns one of them around, so
#   that is what puts a shaft inside a bore rather than beside it.
# * A slotted hole's port is the centre of one end of the slot, and its +X
#   points along the slot towards the other end, which is how far 'moveX' lets
#   the fastener travel.
# * An 8mm REX(TM) port's +X points at a corner of the hex. See '8mmREX' below.
#
# The Jinja2 dictionary below is the orientation of a slot's port ([axis, angle]),
# for every face a slot is cut in: the face is named the way the ports on it are, and
# the direction is the sign of each of the two in-plane axes of that face
# ("p", "m" or "0"): X then Y on the top face, Y then Z on the side walls, and
# X then Z on the front and rear faces.
{% set slot = {
  "top-inner:pp": [[0, 0, 1], 45],
  "top-inner:pm": [[0, 0, -1], 45],
  "top-inner:mp": [[0, 0, 1], 135],
  "top-inner:mm": [[0, 0, -1], 135],
  "top-inner:p0": [[0, 0, 1], 0],
  "top-inner:0p": [[0, 0, 1], 90],
  "top-inner:m0": [[0, 0, 1], 180],
  "top-inner:0m": [[0, 0, -1], 90],
  "top-outer:pp": [[0.92388, 0.382683, 0], 180],
  "top-outer:pm": [[0.92388, -0.382683, 0], 180],
  "top-outer:mp": [[0.382683, 0.92388, 0], 180],
  "top-outer:mm": [[0.382683, -0.92388, 0], 180],
