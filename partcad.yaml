  "left-inner:0p": [[0, -1, 0], 90],
  "left-inner:m0": [[0.57735, -0.57735, -0.57735], 120],
  "left-inner:0m": [[0.707107, 0, -0.707107], 180],
  "left-outer:pp": [[0.678598, 0.281085, 0.678598], 148.600285],
