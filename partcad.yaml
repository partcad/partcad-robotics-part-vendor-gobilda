  # A 2106 Series REX shaft is sold with its E-clip, under one SKU, so that is
  # what is procured: the shaft and the clip, the clip seated in its groove.
  # The 56mm shaft's model has its E-clip in it already.
  {% for length in [64, 72, 80] %}
  motion/shaft_8mmREX_{{ length }}mm_with_clip:
    desc: 8mm REX(TM) Shaft with E-Clip (Stainless Steel, {{ length }}mm Length)
    vendor: gobilda
    sku: 2106-4008-0{{ length }}0
    # https://www.gobilda.com/2106-series-stainless-steel-rex-shaft-8mm-diameter-{{ length }}mm-length/
    type: assy
    path: motion/shaft_8mmREX_with_clip.assy
    parameters:
      length:
        type: int
        default: {{ length }}
    map:
      clip-side: [shaft, 8mmREX-shaft, clip-side]
      clip: [shaft, 8mmREX-shaft, clip]
      clean-side: [shaft, 8mmREX-shaft, clean-side]
