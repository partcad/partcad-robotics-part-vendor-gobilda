        # 4.000mm tapped hole, 8.000mm deep
        h3-front: [[0, -21.5, 0], [-1, 0, 0], 90]
        h4-back: [[0, 21.5, 0], [1, 0, 0], 90]

{#
  The goBILDA pattern of a U-channel. The channel runs along +Y, its top is
  Z=0 to Z=2.5 and its side walls are 2.5mm thick at X=+-21.5 to X=+-24,
  centred on Z=-21.5. It is 24mm per hole, and each 24mm cell carries a 14mm
  hole in the middle of it and the M4 pattern around it. Per face, for each
  interface below: where the face is and how a round hole on it is turned.
#}
{% set walls = [
  ("left-outer", -24, [[0, 1, 0], 90]),
  ("left-inner", -21.5, [[0, 1, 0], -90]),
  ("right-outer", 24, [[0, 1, 0], -90]),
  ("right-inner", 21.5, [[0, 1, 0], 90])
] %}
{% set tops = [
  ("top-outer", 2.5, [[0, 1, 0], 180]),
  ("top-inner", 0, [[0, 1, 0], 0])
] %}
{% set channel = {} %}
{% for size in [2, 5, 7, 9] %}
{% set holes = {"m14": {}, "m4": {}, "diagonal": {}, "center": {}, "long": {}} %}
{# The 14mm holes, one in the middle of each cell but the two at the ends #}
{% for i in range(size) %}
{% set y = 24 + 24 * i %}
{% set _ = holes.m14.update({
  "top-inner-" ~ i: [[0, y, 0], [1, 0, 0], 0],
  "top-outer-" ~ i: [[0, y, 2.5], [1, 0, 0], 180],
  "right-inner-" ~ i: [[21.5, y, -21.5], [0, 1, 0], 90],
  "right-outer-" ~ i: [[24, y, -21.5], [0, 1, 0], -90],
  "left-inner-" ~ i: [[-21.5, y, -21.5], [0, 1, 0], -90],
  "left-outer-" ~ i: [[-24, y, -21.5], [0, 1, 0], 90]
}) %}
{% endfor %}
{% for j in range(size + 1) %}
{# Round, on the 8mm grid, 16mm off the middle of the face #}
{% for face, x, turn in walls %}
{% set _ = holes.m4.update({
  face ~ "-" ~ j ~ "-0-00": [[x, 24 * j + 8, -5.5]] + turn,
  face ~ "-" ~ j ~ "-0-10": [[x, 24 * j + 16, -5.5]] + turn,
  face ~ "-" ~ j ~ "-1-00": [[x, 24 * j + 8, -37.5]] + turn,
  face ~ "-" ~ j ~ "-1-10": [[x, 24 * j + 16, -37.5]] + turn
}) %}
{% endfor %}
{% for face, z, turn in tops %}
{% set _ = holes.m4.update({
  face ~ "-" ~ j ~ "-0-00": [[16, 24 * j + 8, z]] + turn,
  face ~ "-" ~ j ~ "-0-10": [[16, 24 * j + 16, z]] + turn,
  face ~ "-" ~ j ~ "-1-00": [[-16, 24 * j + 8, z]] + turn,
  face ~ "-" ~ j ~ "-1-10": [[-16, 24 * j + 16, z]] + turn
}) %}
{% endfor %}
{# On the 8mm grid, 8mm off the middle, slotted diagonally away from the
   corner of the cell they are nearest to #}
{% for face, x, turn in walls %}
{% set _ = holes.diagonal.update({
  face ~ "-" ~ j ~ "-0-01": [[x, 24 * j + 8, -13.5]] + slot[face ~ ":pp"],
  face ~ "-" ~ j ~ "-0-11": [[x, 24 * j + 16, -13.5]] + slot[face ~ ":mp"],
  face ~ "-" ~ j ~ "-1-01": [[x, 24 * j + 8, -29.5]] + slot[face ~ ":pm"],
  face ~ "-" ~ j ~ "-1-11": [[x, 24 * j + 16, -29.5]] + slot[face ~ ":mm"]
}) %}
{% endfor %}
{% for face, z, turn in tops %}
{% set _ = holes.diagonal.update({
  face ~ "-" ~ j ~ "-0-01": [[8, 24 * j + 8, z]] + slot[face ~ ":pp"],
  face ~ "-" ~ j ~ "-0-11": [[8, 24 * j + 16, z]] + slot[face ~ ":pm"],
  face ~ "-" ~ j ~ "-1-01": [[-8, 24 * j + 8, z]] + slot[face ~ ":mp"],
  face ~ "-" ~ j ~ "-1-11": [[-8, 24 * j + 16, z]] + slot[face ~ ":mm"]
}) %}
{% endfor %}
{# On the middle line of the face, between two cells, slotted towards the
   lower one #}
{% for face, x, turn in walls %}
{% set _ = holes.center.update({face ~ "-" ~ j ~ "-c": [[x, 24 * (j + 1) - 8 * SQRT_2, -21.5]] + slot[face ~ ":m0"]}) %}
{% endfor %}
{% for face, z, turn in tops %}
{% set _ = holes.center.update({face ~ "-" ~ j ~ "-c": [[0, 24 * (j + 1) - 8 * SQRT_2, z]] + slot[face ~ ":0m"]}) %}
{% endfor %}
{% endfor %}
{# Beside each 14mm hole, at the edges of the face, slotted towards the hole #}
{% for j in range(size) %}
{% for face, x, turn in walls %}
{% set _ = holes.long.update({
  face ~ "-" ~ j ~ "-t": [[x, 24 * (j + 1), -5.5]] + slot[face ~ ":0m"],
  face ~ "-" ~ j ~ "-b": [[x, 24 * (j + 1), -37.5]] + slot[face ~ ":0p"]
}) %}
{% endfor %}
{% for face, z, turn in tops %}
{% set _ = holes.long.update({
  face ~ "-" ~ j ~ "-t": [[-16, 24 * (j + 1), z]] + slot[face ~ ":p0"],
  face ~ "-" ~ j ~ "-b": [[16, 24 * (j + 1), z]] + slot[face ~ ":m0"]
}) %}
{% endfor %}
{% endfor %}
{% set _ = channel.update({size: holes}) %}
{% endfor %}

