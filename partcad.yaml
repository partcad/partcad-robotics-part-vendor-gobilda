# How far a fastener can travel in each kind of slot in the goBILDA pattern,
# on top of the 4mm the hole is anyway. A slot joins two holes: one on the 8mm
# grid and one on the 24mm-diameter circle (or, for the "c" slot, the same
# circle drawn around the next cell).
{% set slot_diagonal = "%.3f" | format(4 + 12 - 8 * SQRT_2) %}
{% set slot_center = "%.3f" | format(4 + 24 - 16 * SQRT_2) %}
{% set slot_long = "%.3f" | format(4 + 16 - 8 * SQRT_2) %}

sketches:
  # https://www.gobilda.com/stainless-steel-rex-shafting
  8mmREX:
    desc: 8mm REX(TM) shafting
    type: basic
    circle: 4

interfaces:
  ### Shafts ###
  # 8mm REX shafting
  8mmREX:
    desc: 8mm REX(TM) shafting
    abstract: True
    ports:
      8mmREX:
        # A part implementing a REX interface points +X at a corner of the hex.
        # The port turns that by 15 degrees, so that a flat of the hex is 15
        # degrees off +X, and it is that angle that lets two REX ports meet:
        # connecting two ports swaps their X and Y, which mirrors every angle
        # about 45 degrees, and a hex (60 degree symmetry) only comes out of
        # that mirror unchanged when its flats sit at 15 degrees off +X.
        location: [[0, 0, 0], [0, 0, 1], 15]
        sketch: 8mmREX
  8mmREX-opening:
    desc: Opening for 8mm REX shaft
    abstract: True
    inherits:
      8mmREX: opening
  8mmREX-thru:
    desc: Through hole for 8mm REX shaft
    inherits:
      8mmREX-opening: thru
    parameters:
      turnZ:
        min: -360
        max: 360
        default: 0
    mates:
      - "//pub/std/metric/m:m8-thru"
  {% for depth in [0.7, 5, 8, 9.5, 10, 10.5, 22, 32, 33] %}
  8mmREX-thru-{{ depth }}:
    desc: Through hole of {{ depth }}mm depth for 8mm REX shaft
    inherits:
      8mmREX-thru: {{ depth }}mm
    mates:
      - 8mmREX-thru
  {% endfor %}
  8mmREX-shaft:
    desc: 8mm REX shaft interface
    # Everything on a REX shaft is on the same shaft: bearings, hubs, spacers
    # and collars are stacked along it, and the same end of it can hold several.
    multiConnect: true
    inherits:
      8mmREX: shaft
    parameters:
      # How far along the shaft
      moveZ:
        min: 0
        # The longest 8mm REX shaft goBILDA sells
        max: 624
    mates:
      - 8mmREX-thru
      - "//pub/std/metric/m:m8-thru"

  ### Patterns ###
  # 16mm pattern
{% set pattern_4xM4_16mm = {
  "TL": [[-8, 8, 0], [0, 0, 1], 270],
  "TR": [[8, 8, 0], [0, 0, 1], 180],
  "BR": [[8, -8, 0], [0, 0, 1], 90],
  "BL": [[-8, -8, 0], [0, 0, 1], 0]
} %}
  4xM4-16mm-pattern:
    desc: 4 x M4 at 16mm pattern
  4xM4-16mm-pattern-thru:
    desc: 4 x M4 at 16mm pattern
    inherits:
      4xM4-16mm-pattern: thru
      "//pub/std/metric/m:m4-thru": {{ pattern_4xM4_16mm | tojson }}
    mates:
      - 4xM4-16mm-pattern
  # 4xM4-16mm-pattern-thru-threaded:
  #   desc: 4 x M4 at 16mm pattern, thru, threaded
  #   inherits:
  #     4xM4-16mm-pattern-thru: threaded
  4xM4-16mm-pattern-thru-1.5mm:
    desc: 4 x M4 at 16mm pattern, thru, 1.5mm thick
    inherits:
      4xM4-16mm-pattern: 1.5mm
      "//pub/std/metric/m:m4-thru-1.5": {{ pattern_4xM4_16mm | tojson }}
    mates:
      - 4xM4-16mm-pattern
  4xM4-16mm-pattern-thru-8mm:
    desc: 4 x M4 at 16mm pattern, thru, 8mm thick
    inherits:
      4xM4-16mm-pattern: thru-8mm
      "//pub/std/metric/m:m4-thru-8": {{ pattern_4xM4_16mm | tojson }}
    mates:
      - 4xM4-16mm-pattern
  4xM4-16mm-pattern-threaded-thru-4mm:
    desc: 4 x M4 at 16mm pattern, threaded, 4mm thick
    inherits:
      4xM4-16mm-pattern: threaded-thru-4mm
      "//pub/std/metric/m:m4-threaded-thru-4": {{ pattern_4xM4_16mm | tojson }}
    mates:
      - 4xM4-16mm-pattern

# mates:
#   4xM4-16mm-pattern-thru: 4xM4-16mm-pattern-thru

{#
  The 2106 Series REX shafts are all modelled in the same frame: the axis is at
  X=-43.354, Z=6.967, running along +Y from the end the E-clip is on (Y=23.419).
  The E-clip groove is 0.8mm wide and ends 4mm from that end. Their ports:

  * clip-side: that end of the shaft
  * clip: against the E-clip, on the long side of it - what the clip holds
  * groove: where the E-clip itself sits, facing the clip-side end (not on the
    56mm shaft, whose model has its E-clip in it already)
  * clean-side: the other end
#}
{% set rex_shaft = {} %}
{% for length in [56, 64, 72, 80] %}
{% set ports = {
  "clip-side": [[-43.354, 23.419, 6.967], [1, 0, 0], 90],
  "clip": [[-43.354, 27.419, 6.967], [1, 0, 0], 90]
} %}
{% if length != 56 %}
{% set _ = ports.update({"groove": [[-43.354, 27.419, 6.967], [1, 0, 0], -90]}) %}
{% endif %}
{% set _ = ports.update({"clean-side": [[-43.354, (23.419 + length) | round(3), 6.967], [1, 0, 0], -90]}) %}
{% set _ = rex_shaft.update({length: ports}) %}
{% endfor %}

